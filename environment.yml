name: fire-camera
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - pillow
  - imageio-ffmpeg   # reads recordings (camstills); brings ffmpeg
  - tifffile         # reads the USGS 3DEP elevation (GeoTIFF; camreg/dem3dep.py)
  - imagecodecs      # ...and its compression
